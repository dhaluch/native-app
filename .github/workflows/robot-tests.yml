name: Android Robot Tests WEBDRIVBER I/O

on:
  push:
    branches: [feature/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    outputs:
      artifact_name: ${{ steps.set_meta.outputs.artifact_name }}
      date: ${{ steps.set_meta.outputs.date }}
      datetime: ${{ steps.set_meta.outputs.datetime }}
      branch: ${{ steps.set_meta.outputs.branch }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install dependencies (Python)
        run: |
          python -m pip install --upgrade pip
          pip install robotframework
          pip install robotframework-appiumlibrary
          # Se seus testes NÃO usam Browser/Playwright, remova as 2 linhas abaixo:
          pip install robotframework-browser
          rfbrowser init

      - name: 🛠️ Set up Android SDK & system image (API 29)
        uses: android-actions/setup-android@v3
        with:
          api-level: 29
          components: |
            platform-tools
            emulator
            platforms;android-29
            system-images;android-29;google_apis;x86_64

      - name: 🔧 Create AVD (github_ci_avd) — ensure cmdline-tools & system-image
        run: |
          set -euo pipefail
          echo "Creating AVD 'github_ci_avd' (system-images;android-29;google_apis;x86_64)"

          # Locate sdkmanager and avdmanager (cmdline-tools or tools/bin)
          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMAN="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            AVDMAN="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager"
          elif [ -x "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" ]; then
            SDKMAN="$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
            AVDMAN="$ANDROID_SDK_ROOT/tools/bin/avdmanager"
          else
            echo "sdkmanager/avdmanager not found under $ANDROID_SDK_ROOT. Listing tree for debug:" && ls -la "$ANDROID_SDK_ROOT" || true
            exit 1
          fi

          echo "Using sdkmanager: $SDKMAN"

          # Install cmdline-tools latest if necessary (some runners may not have it)
          if ! "$SDKMAN" --list | grep -q "cmdline-tools"; then
            echo "Installing cmdline-tools;latest"
            "$SDKMAN" --install "cmdline-tools;latest" || true
          fi

          # Ensure system-image and emulator/platform-tools are installed
          echo "Installing system image and basic components (may be no-op if already installed)"
          "$SDKMAN" --install "platform-tools" "emulator" "platforms;android-29" "system-images;android-29;google_apis;x86_64" || true

          # Accept licenses
          echo "Accepting SDK licenses (sdkmanager)"
          yes | "$SDKMAN" --licenses || true

          # Create AVD using the avdmanager we located
          if [ ! -x "$AVDMAN" ]; then
            echo "avdmanager not found at $AVDMAN — aborting." && exit 1
          fi

          # Create AVD; use --force to overwrite if exists. Use 'no' to any interactive prompts.
          printf "no\n" | "$AVDMAN" create avd -n github_ci_avd -k "system-images;android-29;google_apis;x86_64" --force || true

      - name: ▶️ Start emulator (headless)
        run: |
          echo "Starting emulator github_ci_avd"
          EMU_BIN="$ANDROID_SDK_ROOT/emulator/emulator"
          if [ ! -x "$EMU_BIN" ]; then
            EMU_BIN="$ANDROID_SDK_ROOT/tools/emulator"
          fi
          nohup "$EMU_BIN" -avd github_ci_avd -no-window -no-audio -no-snapshot -gpu swiftshader_indirect >/dev/null 2>&1 &
          echo "Waiting for emulator process to appear..."
          for i in $(seq 1 40); do
            if adb devices | grep -q emulator-; then
              echo "Emulator attached." && break
            fi
            sleep 3
          done

      - name: ⏳ Wait for full boot (multi-signal, with timeouts and diagnostics)
        run: |
          set -e
          BOOT_TIMEOUT=600
          PM_TIMEOUT=300

          echo "Waiting for adb device(s) to appear..."
          adb wait-for-device
          echo "Connected devices:" && adb devices -l || true

          echo "⏳ Esperando sys.boot_completed ou dev.bootcomplete..."
          if ! timeout ${BOOT_TIMEOUT}s bash -c 'until adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r" | grep -q "^1$"; do sleep 3; done'; then
            echo "⚠️ sys.boot_completed não sinalizou; tentando dev.bootcomplete..."
            if ! timeout ${BOOT_TIMEOUT}s bash -c 'until adb shell getprop dev.bootcomplete 2>/dev/null | tr -d "\r" | grep -q "^1$"; do sleep 3; done'; then
              echo "❌ Boot não completou dentro de ${BOOT_TIMEOUT}s. Coletando diagnósticos..."
              echo "--- getprop sys.boot_completed / dev.bootcomplete / init.svc.bootanim ---"
              adb shell getprop sys.boot_completed || true
              adb shell getprop dev.bootcomplete || true
              adb shell getprop init.svc.bootanim || true
              echo "--- adb devices ---"
              adb devices -l || true
              echo "--- last 200 lines of logcat ---"
              adb logcat -d | tail -n 200 || true
              exit 1
            fi
          fi
          echo "✅ Sinal de boot recebido."

          echo "⏳ Checando boot animation (tolerante)..."
          timeout 180s bash -c 'until [ "$(adb shell getprop init.svc.bootanim 2>/dev/null | tr -d "\r")" = "stopped" ]; do sleep 2; done' || echo "⚠️ bootanim indisponível — seguindo."

          echo "⏳ Esperando Package Manager (primeiro sinal)..."
          timeout ${PM_TIMEOUT}s bash -c 'until adb shell pm list packages >/dev/null 2>&1; do sleep 3; done'
          echo "✅ Package Manager respondeu uma vez."

          echo "⏳ Stabilizing Package Manager (3 consecutive successes)..."
          ok=0
          for i in $(seq 1 60); do
            if adb shell pm list packages >/dev/null 2>&1; then
              ok=$((ok+1)); echo "✔ PM ok ($ok/3)"
            else
              ok=0; echo "✖ PM falhou — reset contador"
            fi
            [ $ok -ge 3 ] && break
            sleep 2
          done
          [ $ok -ge 3 ] || { echo "❌ Package Manager não estabilizou."; adb shell service list | tail -n +1 || true; exit 1; }

      - name: 🔓 Keep screen awake & go Home (no-fail)
        run: |
          adb shell settings put global stay_on_while_plugged_in 3 || true
          adb shell wm dismiss-keyguard || true
          adb shell am start -a android.intent.action.MAIN -c android.intent.category.HOME || true

      - name: ✅ Ensure Android user & settings service ready + provision
        run: |
          set -e
          adb shell am start-user 0 || true

          SETTINGS_TIMEOUT=240
          echo "⏳ Aguardando serviço 'settings'..."
          if ! timeout ${SETTINGS_TIMEOUT}s bash -c 'until adb shell cmd settings list global >/dev/null 2>&1; do sleep 3; done'; then
            echo "❌ Serviço 'settings' não respondeu dentro do timeout."
            adb shell service list | tail -n +1 || true
            exit 1
          fi
          echo "✅ Serviço 'settings' disponível."

          adb shell cmd settings put global device_provisioned 1 || true
          adb shell cmd settings put secure user_setup_complete 1 || true
          sleep 5

      - name: ✅ Final device readiness (service:package stable)
        run: |
          set -e
          adb shell am start-user 0 || true
          adb shell am start -a android.intent.action.MAIN -c android.intent.category.HOME || true

          echo "⏳ Aguardando service manager registrar 'package'..."
          timeout 300s bash -c 'until adb shell service check package 2>/dev/null | grep -q "found"; do echo "… esperando service package"; sleep 3; done'
          echo "✅ service: package disponível."

          echo "⏳ Verificando 'pm list packages' 3x seguidas (estabilização)..."
          ok=0
          for i in $(seq 1 30); do
            if adb shell pm list packages >/dev/null 2>&1; then
              ok=$((ok+1)); echo "✔ PM ok ($ok/3)"
            else
              ok=0; echo "✖ PM falhou — reset contador"
            fi
            [ $ok -ge 3 ] && break
            sleep 2
          done
          [ $ok -ge 3 ] || { echo "❌ Package Manager não estabilizou."; adb shell service list | tail -n +1 || true; exit 1; }

      - name: 📦 Pre-install AUT (apk) with retries
        run: |
          set -e
          APK_PATH="app/wdio.native.app.apk"  # ajuste o caminho se necessário
          test -f "$APK_PATH" || { echo "❌ APK não encontrado em $APK_PATH"; exit 1; }

          echo "⏳ Instalando APK via adb (até 5 tentativas)..."
          tries=0
          until adb install -r -g "$APK_PATH"; do
            tries=$((tries+1))
            echo "✖ Falha ao instalar (tentativa $tries)."
            if [ $tries -ge 5 ]; then
              echo "❌ Não foi possível instalar o APK após $tries tentativas."
              exit 1
            fi
            echo "⏳ Aguardando 10s e tentando novamente..."
            sleep 10
          done
          echo "✅ APK instalado com sucesso."
          echo "⏳ Pré-lançando app via ADB para acelerar startup (tentativa)..."
          adb shell am start -n com.wdiodemoapp/.MainActivity || true
          echo "⏳ Aguardando 20s após pré-lançamento do app"
          sleep 20

      - name: 📦 Install Appium (CLI + driver)
        run: |
          npm install -g appium
          appium -v
          appium driver install uiautomator2@4.0.1

      - name: 🏃 Start Appium server
        run: |
          nohup appium > appium.log 2>&1 &
          echo "⏳ Aguardando 15s para Appium inicializar"
          sleep 15

      - name: 🧭 Set meta (date, branch, artifact name)
        id: set_meta
        run: |
            DATE=$(date +'%Y-%m-%d')
            DATETIME=$(date +'%Y-%m-%d %H:%M:%S')
            BRANCH='${{ github.ref_name }}'
            SAFE_BRANCH=$(echo "$BRANCH" | sed 's#[/\\:*?"<>|]#-#g')
            ARTIFACT_NAME="robot-logs-${SAFE_BRANCH}-${DATE}"
            echo "date=${DATE}" >> $GITHUB_OUTPUT
            echo "datetime=${DATETIME}" >> $GITHUB_OUTPUT
            echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
            echo "artifact_name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT
            echo "Artifact: ${ARTIFACT_NAME}"

      - name: 🧪 Run Robot Framework tests
        run: |
          mkdir -p logs
          robot --outputdir logs tests/

      - name: 🧷 Ensure logs folder (even on failure)
        if: always()
        env:
          BRANCH: ${{ steps.set_meta.outputs.branch }}
          DATE: ${{ steps.set_meta.outputs.date }}
        run: |
          mkdir -p logs
          [ -f logs/report.html ] || cat > logs/report.html <<HTML
          <!doctype html><meta charset="utf-8"><title>Robot Report — ${BRANCH} — ${DATE}</title>
          <h1>Robot Report — ${BRANCH} — ${DATE}</h1>
          <p>Nenhum relatório foi gerado. Verifique os logs do job de testes.</p>
          HTML
          [ -f logs/log.html ] || cat > logs/log.html <<HTML
          <!doctype html><meta charset="utf-8"><title>Robot Log — ${BRANCH} — ${DATE}</title>
          <h1>Robot Log — ${BRANCH} — ${DATE}</h1>
          <p>Nenhum log disponível. Verifique a execução do job de testes.</p>
          HTML
          [ -f logs/index.html ] || cat > logs/index.html <<HTML
          <!doctype html><meta charset="utf-8">
          <title>Robot Logs — ${BRANCH} — ${DATE}</title>
          <h1>Robot Logs — ${BRANCH} — ${DATE}</h1>
          <p>Redirecionando para <a href="report.html">report.html</a>…</p>
          <meta http-equiv="refresh" content="0; url=report.html">
          HTML

      - name: 📤 Upload Robot Framework logs (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set_meta.outputs.artifact_name }}
          path: logs/

  publish-gh-pages:
    name: Publish Robot report to gh-pages
    needs: test
    runs-on: ubuntu-latest
    if: ${{ github.ref_name != 'gh-pages' }}

    steps:
      - name: 📥 Download test artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.test.outputs.artifact_name }}
          path: site

      - name: ⚙️ Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🚀 Publish to gh-pages using PAT
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ needs.test.outputs.branch }}
          DATE: ${{ needs.test.outputs.date }}
        run: |
          set -euo pipefail
          cd site

          # Read PAT from secrets at runtime; if empty, skip publishing.
          GIT_PAT="${{ secrets.GH_PAGES_PAT }}"
          if [ -z "${GIT_PAT}" ]; then
            echo "GH_PAGES_PAT not set — skipping publish to gh-pages."
            exit 0
          fi

          echo "Contents of downloaded artifact:" && ls -R . || true

          # Ensure report exists
          if [ ! -f logs/report.html ]; then
            echo "⚠️ logs/report.html not found in artifact — nothing to publish."
            exit 0
          fi

          # Initialize a temporary repo and push to gh-pages
          git init
          git checkout -b gh-pages
          git add -A
          git commit -m "Publish Robot report — ${BRANCH} — ${DATE}" || true

          # Push using PAT (masked)
          echo "Pushing to gh-pages branch..."
          git push --force https://${GIT_PAT}@github.com/${REPO} gh-pages

  
