name: Android Robot Tests WEBDRIVBER I/O

on:
  push:
    branches: [feature/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    outputs:
      artifact_name: ${{ steps.set_meta.outputs.artifact_name }}
      date: ${{ steps.set_meta.outputs.date }}
      datetime: ${{ steps.set_meta.outputs.datetime }}
      branch: ${{ steps.set_meta.outputs.branch }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install dependencies (Python)
        run: |
          python -m pip install --upgrade pip
          pip install robotframework
          pip install robotframework-appiumlibrary
          # Se seus testes NÃO usam Browser/Playwright, remova as 2 linhas abaixo:
          pip install robotframework-browser
          rfbrowser init

      - name: 🛠️ Set up Android SDK & system image (API 29)
        uses: android-actions/setup-android@v3
        with:
          api-level: 29
          components: |
            platform-tools
            emulator
            platforms;android-29
            system-images;android-29;google_apis;x86_64

      - name: 🔧 Create AVD (github_ci_avd) - manual creation
        run: |
          echo "Creating AVD 'github_ci_avd' using manual approach to avoid JAXB issues"
          
          # Set up AVD directory
          mkdir -p $HOME/.android/avd
          AVD_NAME="github_ci_avd"
          AVD_DIR="$HOME/.android/avd/${AVD_NAME}.avd"
          
          # Create AVD directory
          mkdir -p "$AVD_DIR"
          
          # Create config.ini for the AVD using echo
          echo "hw.cpu.arch=x86_64" > "$AVD_DIR/config.ini"
          echo "hw.cpu.ncore=2" >> "$AVD_DIR/config.ini"
          echo "hw.ramSize=2048" >> "$AVD_DIR/config.ini"
          echo "image.sysdir.1=system-images/android-29/google_apis/x86_64/" >> "$AVD_DIR/config.ini"
          echo "tag.display=Google APIs" >> "$AVD_DIR/config.ini"
          echo "tag.id=google_apis" >> "$AVD_DIR/config.ini"
          echo "AvdId=${AVD_NAME}" >> "$AVD_DIR/config.ini"
          echo "avd.ini.displayname=${AVD_NAME}" >> "$AVD_DIR/config.ini"
          echo "disk.dataPartition.size=6442450944" >> "$AVD_DIR/config.ini"
          echo "hw.device.name=pixel" >> "$AVD_DIR/config.ini"
          echo "hw.gpu.enabled=yes" >> "$AVD_DIR/config.ini"
          echo "hw.gpu.mode=swiftshader_indirect" >> "$AVD_DIR/config.ini"
          echo "hw.keyboard=yes" >> "$AVD_DIR/config.ini"
          echo "hw.lcd.density=420" >> "$AVD_DIR/config.ini"
          echo "hw.lcd.height=1920" >> "$AVD_DIR/config.ini"
          echo "hw.lcd.width=1080" >> "$AVD_DIR/config.ini"
          
          # Create the AVD ini file using echo
          echo "avd.ini.encoding=UTF-8" > "$HOME/.android/avd/${AVD_NAME}.ini"
          echo "path=${AVD_DIR}" >> "$HOME/.android/avd/${AVD_NAME}.ini"
          echo "path.rel=avd/${AVD_NAME}.avd" >> "$HOME/.android/avd/${AVD_NAME}.ini"
          echo "target=android-29" >> "$HOME/.android/avd/${AVD_NAME}.ini"
          
          echo "AVD created successfully at $AVD_DIR"
          ls -la "$HOME/.android/avd/" || true

      - name: ▶️ Start emulator (headless) with enhanced diagnostics
        run: |
          echo "Starting emulator github_ci_avd with enhanced monitoring"
          
          # Check if AVD exists
          if [ ! -f "$HOME/.android/avd/github_ci_avd.ini" ]; then
            echo "❌ AVD github_ci_avd.ini not found!"
            ls -la "$HOME/.android/avd/" || true
            exit 1
          fi
          
          EMU_BIN="$ANDROID_SDK_ROOT/emulator/emulator"
          if [ ! -x "$EMU_BIN" ]; then
            EMU_BIN="$ANDROID_SDK_ROOT/tools/emulator"
          fi
          
          if [ ! -x "$EMU_BIN" ]; then
            echo "❌ Emulator binary not found at $EMU_BIN"
            find "$ANDROID_SDK_ROOT" -name "emulator" -type f 2>/dev/null || true
            exit 1
          fi
          
          echo "Using emulator binary: $EMU_BIN"
          
          # Start emulator with more verbose options and save log
          "$EMU_BIN" -avd github_ci_avd \
            -no-window -no-audio -no-snapshot \
            -gpu swiftshader_indirect \
            -verbose -show-kernel \
            -wipe-data \
            > emulator.log 2>&1 &
          
          EMU_PID=$!
          echo "Emulator started with PID: $EMU_PID"
          
          # Wait for emulator to appear in adb devices with timeout and diagnostics
          echo "Waiting for emulator to appear in adb devices (max 3 minutes)..."
          for i in $(seq 1 60); do
            echo "Attempt $i/60: Checking adb devices..."
            adb devices -l
            if adb devices | grep -q "emulator-"; then
              echo "✅ Emulator found in adb devices!"
              break
            fi
            if ! kill -0 $EMU_PID 2>/dev/null; then
              echo "❌ Emulator process died! Last 50 lines of emulator.log:"
              tail -n 50 emulator.log || true
              exit 1
            fi
            sleep 3
          done
          
          # Final check
          if ! adb devices | grep -q "emulator-"; then
            echo "❌ Emulator did not appear in adb devices after 3 minutes"
            echo "Process status:" && ps aux | grep emulator || true
            echo "Emulator log (last 100 lines):" && tail -n 100 emulator.log || true
            exit 1
          fi

      - name: ⏳ Wait for full boot (multi-signal, with timeouts and diagnostics)
        run: |
          set -e
          BOOT_TIMEOUT=600
          PM_TIMEOUT=300

          echo "Emulator is visible to adb, now waiting for full boot sequence..."
          echo "Connected devices:" && adb devices -l || true

          # First ensure adb can connect to the device
          echo "Testing basic adb connectivity..."
          for i in $(seq 1 30); do
            if adb shell echo "test" >/dev/null 2>&1; then
              echo "✅ adb shell connectivity confirmed"
              break
            fi
            echo "⏳ Attempt $i/30: adb shell not ready yet..."
            sleep 2
          done

          echo "⏳ Esperando sys.boot_completed ou dev.bootcomplete..."
          if ! timeout ${BOOT_TIMEOUT}s bash -c 'until adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r" | grep -q "^1$"; do echo "Checking boot progress..."; sleep 5; done'; then
            echo "⚠️ sys.boot_completed não sinalizou; tentando dev.bootcomplete..."
            if ! timeout ${BOOT_TIMEOUT}s bash -c 'until adb shell getprop dev.bootcomplete 2>/dev/null | tr -d "\r" | grep -q "^1$"; do echo "Checking dev boot progress..."; sleep 5; done'; then
              echo "❌ Boot não completou dentro de ${BOOT_TIMEOUT}s. Coletando diagnósticos..."
              echo "--- Current device state ---"
              adb devices -l || true
              echo "--- Boot properties ---"
              adb shell getprop sys.boot_completed || echo "sys.boot_completed failed"
              adb shell getprop dev.bootcomplete || echo "dev.bootcomplete failed"  
              adb shell getprop init.svc.bootanim || echo "init.svc.bootanim failed"
              echo "--- Process check ---"
              adb shell ps | grep -E "(zygote|system_server)" || echo "Core processes check failed"
              echo "--- last 50 lines of logcat ---"
              adb logcat -d | tail -n 50 || echo "logcat failed"
              exit 1
            fi
          fi
          echo "✅ Sinal de boot recebido."

          echo "⏳ Checando boot animation (tolerante)..."
          timeout 180s bash -c 'until [ "$(adb shell getprop init.svc.bootanim 2>/dev/null | tr -d "\r")" = "stopped" ]; do sleep 2; done' || echo "⚠️ bootanim indisponível — seguindo."

          echo "⏳ Esperando Package Manager (primeiro sinal)..."
          timeout ${PM_TIMEOUT}s bash -c 'until adb shell pm list packages >/dev/null 2>&1; do sleep 3; done'
          echo "✅ Package Manager respondeu uma vez."

          echo "⏳ Stabilizing Package Manager (3 consecutive successes)..."
          ok=0
          for i in $(seq 1 60); do
            if adb shell pm list packages >/dev/null 2>&1; then
              ok=$((ok+1)); echo "✔ PM ok ($ok/3)"
            else
              ok=0; echo "✖ PM falhou — reset contador"
            fi
            [ $ok -ge 3 ] && break
            sleep 2
          done
          [ $ok -ge 3 ] || { echo "❌ Package Manager não estabilizou."; adb shell service list | tail -n +1 || true; exit 1; }

      - name: 🔓 Keep screen awake & go Home (no-fail)
        run: |
          adb shell settings put global stay_on_while_plugged_in 3 || true
          adb shell wm dismiss-keyguard || true
          adb shell am start -a android.intent.action.MAIN -c android.intent.category.HOME || true

      - name: ✅ Ensure Android user & settings service ready + provision
        run: |
          set -e
          adb shell am start-user 0 || true

          SETTINGS_TIMEOUT=240
          echo "⏳ Aguardando serviço 'settings'..."
          if ! timeout ${SETTINGS_TIMEOUT}s bash -c 'until adb shell cmd settings list global >/dev/null 2>&1; do sleep 3; done'; then
            echo "❌ Serviço 'settings' não respondeu dentro do timeout."
            adb shell service list | tail -n +1 || true
            exit 1
          fi
          echo "✅ Serviço 'settings' disponível."

          adb shell cmd settings put global device_provisioned 1 || true
          adb shell cmd settings put secure user_setup_complete 1 || true
          sleep 5

      - name: ✅ Final device readiness (service:package stable)
        run: |
          set -e
          adb shell am start-user 0 || true
          adb shell am start -a android.intent.action.MAIN -c android.intent.category.HOME || true

          echo "⏳ Aguardando service manager registrar 'package'..."
          timeout 300s bash -c 'until adb shell service check package 2>/dev/null | grep -q "found"; do echo "… esperando service package"; sleep 3; done'
          echo "✅ service: package disponível."

          echo "⏳ Verificando 'pm list packages' 3x seguidas (estabilização)..."
          ok=0
          for i in $(seq 1 30); do
            if adb shell pm list packages >/dev/null 2>&1; then
              ok=$((ok+1)); echo "✔ PM ok ($ok/3)"
            else
              ok=0; echo "✖ PM falhou — reset contador"
            fi
            [ $ok -ge 3 ] && break
            sleep 2
          done
          [ $ok -ge 3 ] || { echo "❌ Package Manager não estabilizou."; adb shell service list | tail -n +1 || true; exit 1; }

      - name: 📦 Pre-install AUT (apk) with retries
        run: |
          set -e
          APK_PATH="app/wdio.native.app.apk"  # ajuste o caminho se necessário
          test -f "$APK_PATH" || { echo "❌ APK não encontrado em $APK_PATH"; exit 1; }

          echo "⏳ Instalando APK via adb (até 5 tentativas)..."
          tries=0
          until adb install -r -g "$APK_PATH"; do
            tries=$((tries+1))
            echo "✖ Falha ao instalar (tentativa $tries)."
            if [ $tries -ge 5 ]; then
              echo "❌ Não foi possível instalar o APK após $tries tentativas."
              exit 1
            fi
            echo "⏳ Aguardando 10s e tentando novamente..."
            sleep 10
          done
          echo "✅ APK instalado com sucesso."
          echo "⏳ Pré-lançando app via ADB para acelerar startup (tentativa)..."
          adb shell am start -n com.wdiodemoapp/.MainActivity || true
          echo "⏳ Aguardando 20s após pré-lançamento do app"
          sleep 20

      - name: 📦 Install Appium (CLI + driver)
        run: |
          npm install -g appium
          appium -v
          appium driver install uiautomator2@4.0.1

      - name: 🏃 Start Appium server
        run: |
          nohup appium > appium.log 2>&1 &
          echo "⏳ Aguardando 15s para Appium inicializar"
          sleep 15

      - name: 🧭 Set meta (date, branch, artifact name)
        id: set_meta
        run: |
            DATE=$(date +'%Y-%m-%d')
            DATETIME=$(date +'%Y-%m-%d %H:%M:%S')
            BRANCH='${{ github.ref_name }}'
            SAFE_BRANCH=$(echo "$BRANCH" | sed 's#[/\\:*?"<>|]#-#g')
            ARTIFACT_NAME="robot-logs-${SAFE_BRANCH}-${DATE}"
            echo "date=${DATE}" >> $GITHUB_OUTPUT
            echo "datetime=${DATETIME}" >> $GITHUB_OUTPUT
            echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
            echo "artifact_name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT
            echo "Artifact: ${ARTIFACT_NAME}"

      - name: 🧪 Run Robot Framework tests
        run: |
          mkdir -p logs
          robot --outputdir logs tests/

      - name: 🧷 Ensure logs folder (even on failure)
        if: always()
        env:
          BRANCH: ${{ steps.set_meta.outputs.branch }}
          DATE: ${{ steps.set_meta.outputs.date }}
        run: |
          mkdir -p logs
          [ -f logs/report.html ] || cat > logs/report.html <<HTML
          <!doctype html><meta charset="utf-8"><title>Robot Report — ${BRANCH} — ${DATE}</title>
          <h1>Robot Report — ${BRANCH} — ${DATE}</h1>
          <p>Nenhum relatório foi gerado. Verifique os logs do job de testes.</p>
          HTML
          [ -f logs/log.html ] || cat > logs/log.html <<HTML
          <!doctype html><meta charset="utf-8"><title>Robot Log — ${BRANCH} — ${DATE}</title>
          <h1>Robot Log — ${BRANCH} — ${DATE}</h1>
          <p>Nenhum log disponível. Verifique a execução do job de testes.</p>
          HTML
          [ -f logs/index.html ] || cat > logs/index.html <<HTML
          <!doctype html><meta charset="utf-8">
          <title>Robot Logs — ${BRANCH} — ${DATE}</title>
          <h1>Robot Logs — ${BRANCH} — ${DATE}</h1>
          <p>Redirecionando para <a href="report.html">report.html</a>…</p>
          <meta http-equiv="refresh" content="0; url=report.html">
          HTML

      - name: 📤 Upload Robot Framework logs (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set_meta.outputs.artifact_name }}
          path: logs/

  publish-gh-pages:
    name: Publish Robot report to gh-pages
    needs: test
    runs-on: ubuntu-latest
    if: ${{ github.ref_name != 'gh-pages' }}

    steps:
      - name: 📥 Download test artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.test.outputs.artifact_name }}
          path: site

      - name: ✅ Ensure report exists
        run: |
          if [ ! -f site/logs/report.html ]; then
            echo "No Robot report found at site/logs/report.html — nothing to publish."
            exit 0
          fi

      - name: ⚙️ Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🚀 Publish to gh-pages using PAT
        run: |
          set -euo pipefail
          cd site

          # Check for PAT secret
          if [ -z "${{ secrets.GH_PAGES_PAT }}" ]; then
            echo "GH_PAGES_PAT secret is not set. Cannot publish to gh-pages."
            exit 1
          fi

          echo "Contents of downloaded artifact:" && ls -R . || true

          # Initialize git repo and push to gh-pages
          git init
          git checkout -b gh-pages
          git add -A
          git commit -m "Publish Robot report — ${{ needs.test.outputs.branch }} — ${{ needs.test.outputs.date }}" || true

          # Push using PAT (masked)
          git remote add origin "https://${{ secrets.GH_PAGES_PAT }}@github.com/${{ github.repository }}.git"
          git push --force origin gh-pages